name: Update GitHub Stats SVGs

# Run daily and also allow manual runs
on:
  schedule:
    - cron: '15 0 * * *'   # every day at 00:15 UTC (you can change)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true  # use GITHUB_TOKEN for pushing

      - name: Create images folder
        run: mkdir -p images

      - name: Download GitHub Stats SVG (try mirror then main)
        run: |
          set -euo pipefail

          USERNAME="Abhijith911"
          OUT1="images/github-stats.svg"
          OUT2="images/top-langs.svg"

          # Candidate URLs (mirror first, then official)
          URL1_MIRROR="https://github-readme-stats-git-masterorgs.vercel.app/api?username=${USERNAME}&show_icons=true&theme=tokyonight&hide_border=false&border_radius=10"
          URL1_MAIN="https://github-readme-stats.vercel.app/api?username=${USERNAME}&show_icons=true&theme=tokyonight&hide_border=false&border_radius=10"

          URL2_MIRROR="https://github-readme-stats-git-masterorgs.vercel.app/api/top-langs/?username=${USERNAME}&layout=compact&theme=tokyonight&hide_border=false&border_radius=10&langs_count=10"
          URL2_MAIN="https://github-readme-stats.vercel.app/api/top-langs/?username=${USERNAME}&layout=compact&theme=tokyonight&hide_border=false&border_radius=10&langs_count=10"

          download_and_check() {
            local url=$1 out=$2
            echo "Trying $url"
            curl -sL --fail "$url" -o /tmp/temp.svg || return 1
            # Ensure file looks like an SVG (starts with <svg)
            if grep -q -i '^<svg' /tmp/temp.svg ; then
              mv /tmp/temp.svg "$out"
              return 0
            else
              # not an svg (likely an HTML error page)
              rm -f /tmp/temp.svg
              return 1
            fi
          }

          # First card
          if ! download_and_check "$URL1_MIRROR" "$OUT1"; then
            download_and_check "$URL1_MAIN" "$OUT1" || (echo "Both URL1 attempts failed" && exit 0)
          fi

          # Second card
          if ! download_and_check "$URL2_MIRROR" "$OUT2"; then
            download_and_check "$URL2_MAIN" "$OUT2" || (echo "Both URL2 attempts failed" && exit 0)
          fi

          echo "Downloaded SVGs to images/"

      - name: Commit & push if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add images/github-stats.svg images/top-langs.svg || true

          # If there are changes, commit and push
          if git diff --cached --quiet; then
            echo "No changes in SVGs. Nothing to commit."
          else
            git commit -m "Update GitHub stats SVGs (automated)"
            git push origin HEAD:${{ github.ref_name || 'main' }} || git push origin HEAD:main
          fi
